<main class="contenedor">
    <!-- Tabla Estilizada -->
    <table class="tabla-animales">
        <thead>
            <tr>
                <th>Cuidador</th>
                <th>Nombre del Animal</th>
            </tr>
        </thead>
        <tbody>
            {% for animales in mostrar_post_anaimales %}
            <tr>
                <td>{{ animales.cuidador }}</td>
                <td><strong>{{ animales.nombre }}</strong></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</main>

<div class="regreso">
<a href="{% url 'index' %}">Volver</a>
</div>

<!-- Estilos CSS para que quede bonita -->
<style>
    .contenedor {
        max-width: 1000px;
        margin: 20px auto;
        padding: 0 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .tabla-animales {
        width: 100%;
        border-collapse: collapse;
        margin: 25px 0;
        font-size: 0.9em;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
        border-radius: 8px 8px 0 0;
        overflow: hidden;
    }
    .tabla-animales thead tr {
        background-color: #009879;
        color: #ffffff;
        text-align: left;
        font-weight: bold;
    }
    .tabla-animales th, .tabla-animales td {
        padding: 12px 15px;
    }
    .tabla-animales tbody tr {
        border-bottom: 1px solid #dddddd;
    }
    .tabla-animales tbody tr:nth-of-type(even) {
        background-color: #f3f3f3;
    }
    .tabla-animales tbody tr:last-of-type {
        border-bottom: 2px solid #009879;
    }
    .regreso a{
        color: #008000;
    }
</style>
